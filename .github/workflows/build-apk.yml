name: Gerar APK Android

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - principal

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK
        run: |
          chmod +x gradlew
          ./gradlew :aplicativo:assembleDebug

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: Garra-Android-APK
          path: aplicativo/build/outputs/apk/debug/*.apk
